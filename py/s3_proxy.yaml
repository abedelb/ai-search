apiVersion: v1
kind: ConfigMap
metadata:
  name: s3-proxy-config
data:
  nginx.conf: |
    events {
      worker_connections 1024;
    }
    http {
      server {
        listen 80;
        location ~ ^/([^/]+)/(.*)$ {
          resolver kube-dns.kube-system.svc.cluster.local;
          set $bucket $1;
          set $path $2;
          proxy_pass https://$bucket.s3.amazonaws.com/$path;
          proxy_set_header Host $bucket.s3.amazonaws.com;
          proxy_ssl_server_name on;
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: s3-proxy
spec:
  replicas: 2
  selector:
    matchLabels:
      app: s3-proxy
  template:
    metadata:
      labels:
        app: s3-proxy
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80
        volumeMounts:
        - name: config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
      volumes:
      - name: config
        configMap:
          name: s3-proxy-config
---
apiVersion: v1
kind: Service
metadata:
  name: s3-proxy
spec:
  selector:
    app: s3-proxy
  ports:
  - port: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: s3-proxy
spec:
  ingressClassName: nginx
  rules:
  - host: example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: s3-proxy
            port:
              number: 80